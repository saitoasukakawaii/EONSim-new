name: Website Build Check

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-build.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VitePress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Add draft and template isolation sentinels
        working-directory: website
        run: |
          mkdir -p drafts templates
          printf "# EONSIM_PRIVATE_DRAFT_SENTINEL_20261030\n" > drafts/ci-isolation-probe.md
          printf "# EONSIM_PRIVATE_TEMPLATE_SENTINEL_20261030\n" > templates/ci-isolation-probe.md

      - name: Build public website
        working-directory: website
        run: npm run docs:build

      - name: Check Markdown and unpublished content isolation
        working-directory: website
        run: npm run docs:check
